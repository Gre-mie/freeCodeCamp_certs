<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="An application that generates emoji cards from 1-10.">
    <meta name="keywords" content="card, emojie, generate">

    <meta name="robots" content="all noarchive nocache">

    <link rel="stylesheet" href="./styles.css">

    <meta property="og:url" content="https://example.com/playing-cards">
    <meta property="og:title" content="Playing Cards">
    <meta property="og:description" content="An application that generates emoji cards from 1-10.">
    <meta property="og:type" content="website">

    <meta name="application-name" content="Playing Cards" lang="en">
    <title>Playing cards</title>
  </head>
  <body>
    <h1>Playing Cards</h1>

    <div class="sr-only">
      <p id="cake-emoji">A slice of cake.</p>
      <p id="devil-emoji">A mischievous grinning with horns.</p>
      <p id="face-emoji">A smiling face with closed eyes and tounge sticking out.</p>
      <p id="duck-emoji">A duck shown from the side.</p>
    </div>

    <button 
      id="deal-btn" 
      type="button"
      onclick="deal()" 
    >Deal Cards</button>
 
    <main 
      id="playing-cards"
      data-types="😋😈🦆🍰"
    >

      <div id="card1" class="card" aria-describedby="face-emoji">
        <div class="left">
          <span class="num">2</span>
          <span class="type">😋</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>😋</span>
          </div>
          <div class="bottom rotate">
            <span>😋</span>
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">2</span>
          <span class="type">😋</span>
        </div>
      </div>

      <div id="card2" class="card" aria-describedby="cake-emoji">
        <div class="left">
          <span class="num">7</span>
          <span class="type">🍰</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>🍰</span>
            <span>🍰</span>
            <span>🍰</span>
            <span>🍰</span>
          </div>
          <div class="bottom rotate">
            <span>🍰</span>
            <span>🍰</span>
            <span>🍰</span>
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">7</span>
          <span class="type">🍰</span>
        </div>
      </div>

      <div id="card3" class="card" aria-describedby="devil-emoji">
        <div class="left">
          <span class="num">6</span>
          <span class="type">😈</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>😈</span>
            <span>😈</span>
            <span>😈</span>
          </div>
          <div class="bottom rotate">
            <span>😈</span>
            <span>😈</span>
            <span>😈</span>
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">6</span>
          <span class="type">😈</span>
        </div>
      </div>

      <div id="card4" class="card" aria-describedby="devil-emoji">
        <div class="left">
          <span class="num">3</span>
          <span class="type">😈</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>😈</span>
            <span>😈</span>
          </div>
          <div class="bottom rotate">
            <span>😈</span>
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">3</span>
          <span class="type">😈</span>
        </div>
      </div>

      <div id="card5" class="card" aria-describedby="face-emoji">
        <div class="left">
          <span class="num">10</span>
          <span class="type">😋</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>😋</span>
            <span>😋</span>
            <span>😋</span>
            <span>😋</span>
            <span>😋</span>
          </div>
          <div class="bottom rotate">
            <span>😋</span>
            <span>😋</span>
            <span>😋</span>
            <span>😋</span>
            <span>😋</span>
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">10</span>
          <span class="type">😋</span>
        </div>
      </div>

      <div id="card6" class="card" aria-describedby="cake-emoji">
        <div class="left">
          <span class="num">1</span>
          <span class="type">🍰</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>🍰</span>
          </div>
          <div class="bottom rotate">
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">1</span>
          <span class="type">🍰</span>
        </div>
      </div>

      <div id="card7" class="card" aria-describedby="duck-emoji">
        <div class="left">
          <span class="num">9</span>
          <span class="type">🦆</span>
        </div>

        <div class="middle" aria-hidden="true">
          <div class="top">
            <span>🦆</span>
            <span>🦆</span>
            <span>🦆</span>
            <span>🦆</span>
            <span>🦆</span>
          </div>
          <div class="bottom rotate">
            <span>🦆</span>
            <span>🦆</span>
            <span>🦆</span>
            <span>🦆</span>
          </div>
        </div>

        <div class="right rotate" aria-hidden="true">
          <span class="num">9</span>
          <span class="type">🦆</span>
        </div>
      </div>
    </main>

    <script>
      let mainEl = document.getElementById('playing-cards')
      const DeckRange = 10;
      const CardTypes = getTypes(mainEl.getAttribute('data-types'));
      const DeckSize = 7;

      // returns an array of emojies - emojies count as more than one charactor when indexing
      function getTypes(str) { 
        // check for bad types
        if (typeof str === 'undefined') {
          console.log(`WARNING: getTypes() was given undefined value`); 
          return [];
        }
        if (str === null) {
          console.log(`WARNING: getTypes() was given null value`); 
          return [];
        }
        // split emoji string into array
        let emojiArr = [...str];

        return emojiArr;
      }

      // creates a string of emojies in span elements
      function getEmojiHTMLString(emoji, num) {
        let str = "";
        for (let i = 0; i < num; i++) {
          str += `<span>${emoji}</span>`;
        }
        return str;
      }

      // generates and populates one card 
      function newCard(cardId) {
        let typeIndex = Math.floor(Math.random() * CardTypes.length);
        let type = CardTypes[typeIndex];
        let num = Math.floor(Math.random() * DeckRange) + 1;

        let card = document.getElementById(cardId);
        switch (type) {
          case "😋":
            card.setAttribute("aria-describedby", "face-emoji");
            break;
          case "😈":
            card.setAttribute("aria-describedby", "devil-emoji");
            break;
          case "🦆":
            card.setAttribute("aria-describedby", "duck-emoji");
            break;
          case "🍰":
            card.setAttribute("aria-describedby", "cake-emoji");
            break;
          default:
            console.log("Error: aria-describedby not updated...")
        }

        let numArr = document.querySelectorAll(`#${cardId} .num`);
        for (let i = 0; i < numArr.length; i++ ) {
          numArr[i].innerHTML = `${num}`;
        }

        let typeArr = document.querySelectorAll(`#${cardId} .type`); 
        // set new type
        for (let i = 0; i < typeArr.length; i++) {
          typeArr[i].innerHTML = CardTypes[typeIndex];
        }

        // set top and bottom areas to emoji strings representing the card number
        let top = Math.ceil(num / 2);
        let bottom = num - top;

        let topStr = getEmojiHTMLString(CardTypes[typeIndex], top);
        let bottomStr = getEmojiHTMLString(CardTypes[typeIndex], bottom);
        document.querySelector(`#${cardId} .top`).innerHTML = topStr;
        document.querySelector(`#${cardId} .bottom`).innerHTML = bottomStr;
      }

      function deal() {
        // loop cards and repopulate
        for (let i = 1; i <= DeckSize; i++) {
          newCard(`card${i}`);
        }
      }
    </script>

  </body>
</html>
