<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A book inventory application to keep track of books on a reading list.">
    <meta name="keywords" content="book, inventory, track, reading, progress">

    <meta name="robots" content="all noarchive nocache">

    <link rel="stylesheet" href="./styles.css">

    <meta property="og:title" content="Book Inventory">
    <meta property="og:description" content="A book inventory application to keep track of books on a reading list.">
    <meta property="og:type" content="website">

    <meta name="application-name" content="Book Inventory" lang="en">
    <title>Book Inventory</title>
  </head>

  <body>
    <!-- NOTE: Tests are to restricting, 
          they dont allow additional columns or extra areas to add 
          buttons for updating Status or rating area 
    -->

    <h1>Book Inventory</h1>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody>
        <tr class="to-read">
          <td>The Nature of Code</td>
          <td>Daniel Shiffman</td>
          <td>Education</td>
          <td>
            <span class="status">To Read</span>
          </td>
          <td>
            <span class="rate">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

        <tr id="1" class="in-progress">
          <td>Thinking in Systems</td>
          <td>Donella H. Meadows</td>
          <td>Entertainment</td>
          <td>
            <span class="status">In Progress</span>
          </td>
          <td>
            <!-- add class to element, one, two or three, if status = read -->
            <span class="rate">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

            <!-- read, to-read, in-progress -->
        <tr id="2" class="read">
          <td>Crafting Interpreters</td>
          <td>Robert Nystrom</td>
          <td>Education</td>
          <td>
            <span class="status">Read</span> 
          </td>
          <td>
            <!-- add class to element, one, two or three, if status = read -->
            <span class="rate two">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

      </tbody>
    </table>

    <form action="" method=""> <!-- TODO: update action and method to work with JS -->
      <h2>Add a Book</h2>
      <div>
        <label for="form-book-title">Title</label>
        <input 
          id="form-book-title"
          name="book-title"
          type="text"
          minlength="3"
          maxlength="50"
          size="20"
          required
        >
      </div>
      <div>
        <label for="form-book-author">Author</label>
        <input
          id="form-book-author"
          name="book-author"
          type="text"
          minlength="3"
          max-length="100"
          size="20"
          required
        >
      </div>

      <div>
        <label for="form-book-category">Category</label>
        <select 
          id="form-book-category"
          name="book-category"
          required
        >
          <option value="">--choose a category--</option>
          <hr/>
          <option value="autobiography">autobiography</option>
          <option value="education">Education</option>
          <option value="entertainment">Entertainment</option>
          <option value="other">Other</option>
        </select>
      </div>
      <input id="form-submit-book" type="submit" value="Add Book">
    </form>

  </body>
</html>
